<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>部门待审批申请</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f9fc;
            color: #243047;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            overflow-wrap: anywhere;
        }
        th { background: #edf2fa; }
        a { color: #2563eb; }
        nav {
            display: flex;
            gap: 20px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
<a th:href="@{/}">返回首页</a>
<h1>部门待审批申请</h1>

<p th:if="${successMessage}" th:text="${successMessage}"
   style="color: #15803d;"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}"
   style="color: #b91c1c;"></p>

<p>
    共 <strong th:text="${applicationPage.totalElements}">0</strong> 条待审批申请
</p>

<table>
    <thead>
    <tr>
        <th>申请编号</th>
        <th>申请人编号</th>
        <th>资产编号</th>
        <th>资产名称</th>
        <th>用途</th>
        <th>提交时间</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${applicationPage.content}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.applicantId}"></td>
        <td th:text="${item.assetCode}"></td>
        <td th:text="${item.assetName}"></td>
        <td th:text="${item.purpose}"></td>
        <td th:text="${#temporals.format(
                item.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
        <td>
            <a th:href="@{/approver/applications/{id}(id=${item.id})}">
                审批
            </a>
        </td>
    </tr>
    <tr th:if="${applicationPage.empty}">
        <td colspan="7">暂无需要你审批的申请</td>
    </tr>
    </tbody>
</table>

<nav th:if="${applicationPage.totalPages > 0}">
    <a th:if="${applicationPage.hasPrevious()}"
       th:href="@{/approver/applications(
           page=${applicationPage.number - 1}
       )}">上一页</a>

    <span>
        第 <span th:text="${applicationPage.number + 1}"></span> 页，
        共 <span th:text="${applicationPage.totalPages}"></span> 页
    </span>

    <a th:if="${applicationPage.hasNext()}"
       th:href="@{/approver/applications(
           page=${applicationPage.number + 1}
       )}">下一页</a>
</nav>
</body>
</html>
