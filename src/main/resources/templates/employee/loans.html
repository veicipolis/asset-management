<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的领用记录</title>
</head>
<body>
<h1>我的领用记录</h1>

<p>
    <a th:href="@{/employee/assets}">可领用资产</a>
    |
    <a th:href="@{/employee/applications}">我的申请</a>
</p>

<p th:if="${success}" th:text="${success}" style="color: green;"></p>
<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>领用编号</th>
        <th>资产编号</th>
        <th>资产名称</th>
        <th>发放时间</th>
        <th>归还时间</th>
        <th>状态与操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${loanPage.empty}">
        <td colspan="6">暂无领用记录</td>
    </tr>

    <tr th:each="item : ${loanPage.content}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.assetCode}"></td>
        <td th:text="${item.assetName}"></td>
        <td th:text="${#temporals.format(item.issuedAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${item.returnedAt == null ? '—' :
            #temporals.format(item.returnedAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td>
            <span th:if="${item.returnedAt != null}">已归还</span>

            <span th:if="${item.returnedAt == null and item.returnPending}">
                待管理员接收
            </span>

            <form th:if="${item.returnedAt == null and !item.returnPending}"
                  th:action="@{/employee/loans/{id}/return(id=${item.id})}"
                  method="post">
                <button type="submit">申请归还</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p>
    <a th:if="${loanPage.hasPrevious()}"
       th:href="@{/employee/loans(page=${loanPage.number - 1})}">上一页</a>

    <span th:text="|第 ${loanPage.number + 1} 页|"></span>

    <a th:if="${loanPage.hasNext()}"
       th:href="@{/employee/loans(page=${loanPage.number + 1})}">下一页</a>
</p>
</body>
</html>
