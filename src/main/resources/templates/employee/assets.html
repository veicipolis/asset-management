<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>可领用资产</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            color: #243047;
            background: #f7f9fc;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: end;
            margin: 24px 0;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        input, select, button {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th { background: #edf2fa; }
        a { color: #2563eb; }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 24px;
        }
    </style>
</head>
<body>
<a th:href="@{/}">返回首页</a>
<h1>可领用资产</h1>
<p th:if="${successMessage}"
   th:text="${successMessage}"
   style="color: #15803d;"></p>
<p>以下资产当前处于闲置状态。</p>

<form method="get" th:action="@{/employee/assets}">
    <label>
        资产编号
        <input type="text" name="assetCode"
               th:value="${assetCode}"
               maxlength="50" placeholder="完整编号">
    </label>

    <label>
        名称
        <input type="text" name="name"
               th:value="${name}"
               maxlength="100" placeholder="名称关键词">
    </label>

    <label>
        分类
        <select name="categoryId">
            <option value="">全部分类</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                    th:selected="${category.id == categoryId}">
            </option>
        </select>
    </label>

    <button type="submit">查询</button>
    <a th:href="@{/employee/assets}">重置</a>
</form>

<p>
    共 <strong th:text="${assetPage.totalElements}">0</strong> 项可领用资产
</p>

<table>
    <thead>
    <tr>
        <th>资产编号</th>
        <th>名称</th>
        <th>分类</th>
        <th>存放位置</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="asset : ${assetPage.content}">
        <td th:text="${asset.assetCode}"></td>
        <td th:text="${asset.name}"></td>
        <td th:text="${asset.categoryName}"></td>
        <td th:text="${asset.location}"></td>
        <td>
            <a th:href="@{/employee/assets/{id}/apply(id=${asset.id})}">
                申请领用
            </a>
        </td>
    </tr>
    <tr th:if="${assetPage.empty}">
        <td colspan="5">暂无符合条件的可领用资产</td>
    </tr>
    </tbody>
</table>

<nav th:if="${assetPage.totalPages > 0}">
    <a th:if="${assetPage.hasPrevious()}"
       th:href="@{/employee/assets(
           page=${assetPage.number - 1},
           assetCode=${assetCode},
           name=${name},
           categoryId=${categoryId}
       )}">上一页</a>

    <span>
        第 <span th:text="${assetPage.number + 1}"></span> 页，
        共 <span th:text="${assetPage.totalPages}"></span> 页
    </span>

    <a th:if="${assetPage.hasNext()}"
       th:href="@{/employee/assets(
           page=${assetPage.number + 1},
           assetCode=${assetCode},
           name=${name},
           categoryId=${categoryId}
       )}">下一页</a>
</nav>
</body>
</html>
