<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>待发放申请</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f9fc;
            color: #243047;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            overflow-wrap: anywhere;
        }
        th { background: #edf2fa; }
        a { color: #2563eb; }
        nav { display: flex; gap: 20px; margin-top: 24px; }
    </style>
</head>
<body>
<a th:href="@{/assets}">返回资产列表</a>
<h1>待发放申请</h1>

<p th:if="${successMessage}" th:text="${successMessage}"
   style="color: #15803d;"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}"
   style="color: #b91c1c;"></p>

<p>共 <strong th:text="${issuePage.totalElements}">0</strong> 条已批准申请</p>

<table>
    <thead>
    <tr>
        <th>申请编号</th>
        <th>领用人编号</th>
        <th>资产编号</th>
        <th>资产名称</th>
        <th>用途</th>
        <th>资产状态</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${issuePage.content}">
        <td th:text="${item.applicationId}"></td>
        <td th:text="${item.applicantId}"></td>
        <td th:text="${item.assetCode}"></td>
        <td th:text="${item.assetName}"></td>
        <td th:text="${item.purpose}"></td>
        <td th:switch="${item.assetStatus.name()}">
            <span th:case="'IDLE'">闲置</span>
            <span th:case="'IN_USE'">使用中</span>
            <span th:case="'MAINTENANCE'">维修中</span>
            <span th:case="'SCRAPPED'">已报废</span>
        </td>
        <td>
            <a th:if="${item.assetStatus.name() == 'IDLE'}"
               th:href="@{/admin/issues/{id}(id=${item.applicationId})}">
                确认发放
            </a>
            <span th:unless="${item.assetStatus.name() == 'IDLE'}">
                暂不可发放
            </span>
        </td>
    </tr>
    <tr th:if="${issuePage.empty}">
        <td colspan="7">暂无已批准的待发放申请</td>
    </tr>
    </tbody>
</table>

<nav th:if="${issuePage.totalPages > 0}">
    <a th:if="${issuePage.hasPrevious()}"
       th:href="@{/admin/issues(page=${issuePage.number - 1})}">上一页</a>
    <span>
        第 <span th:text="${issuePage.number + 1}"></span> 页，
        共 <span th:text="${issuePage.totalPages}"></span> 页
    </span>
    <a th:if="${issuePage.hasNext()}"
       th:href="@{/admin/issues(page=${issuePage.number + 1})}">下一页</a>
</nav>
</body>
</html>
