<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>资产列表</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            color: #243047;
            background: #f7f9fc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th { background: #edf2fa; }
        a { color: #2563eb; }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 24px;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: end;
            margin: 24px 0;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        input, select, button {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
<a th:href="@{/}">返回首页</a>
<h1>资产列表</h1>
<p><a th:href="@{/admin/issues}">待发放申请</a></p>
<p th:if="${successMessage}"
   th:text="${successMessage}"
   style="color: #15803d;"></p>

<p><a th:href="@{/assets/new}">新增资产</a></p>
<form method="get" th:action="@{/assets}">
    <label>
        资产编号
        <input type="text" name="assetCode"
               th:value="${assetCode}"
               maxlength="50" placeholder="完整编号">
    </label>

    <label>
        名称
        <input type="text" name="name"
               th:value="${name}"
               maxlength="100" placeholder="名称关键词">
    </label>

    <label>
        分类
        <select name="categoryId">
            <option value="">全部分类</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                    th:selected="${category.id == categoryId}">
            </option>
        </select>
    </label>

    <label>
        状态
        <select name="status">
            <option value="">全部状态</option>
            <option value="IDLE"
                    th:selected="${status != null and status.name() == 'IDLE'}">
                闲置
            </option>
            <option value="IN_USE"
                    th:selected="${status != null and status.name() == 'IN_USE'}">
                使用中
            </option>
            <option value="MAINTENANCE"
                    th:selected="${status != null and status.name() == 'MAINTENANCE'}">
                维修中
            </option>
            <option value="SCRAPPED"
                    th:selected="${status != null and status.name() == 'SCRAPPED'}">
                已报废
            </option>
        </select>
    </label>

    <button type="submit">查询</button>
    <a th:href="@{/assets}">重置</a>
</form>

<p>共 <strong th:text="${assetPage.totalElements}">0</strong> 项资产</p>

<table>
    <thead>
    <tr>
        <th>资产编号</th>
        <th>名称</th>
        <th>分类</th>
        <th>购置日期</th>
        <th>原值（元）</th>
        <th>存放位置</th>
        <th>状态</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="asset : ${assetPage.content}">
        <td th:text="${asset.assetCode}"></td>
        <td th:text="${asset.name}"></td>
        <td th:text="${asset.category.name}"></td>
        <td th:text="${asset.purchaseDate}"></td>
        <td th:text="${#numbers.formatDecimal(asset.originalValue, 1, 2)}"></td>
        <td th:text="${asset.location}"></td>
        <td th:switch="${asset.status.name()}">
            <span th:case="'IDLE'">闲置</span>
            <span th:case="'IN_USE'">使用中</span>
            <span th:case="'MAINTENANCE'">维修中</span>
            <span th:case="'SCRAPPED'">已报废</span>
            <span th:case="*" th:text="${asset.status}"></span>
        </td>
        <td>
            <a th:if="${asset.status.name() != 'SCRAPPED'}"
               th:href="@{/assets/{id}/edit(id=${asset.id})}">
                编辑
            </a>
        </td>
    </tr>
    <tr th:if="${assetPage.empty}">
        <td colspan="8">暂无资产数据</td>
    </tr>
    </tbody>
</table>

<nav th:if="${assetPage.totalPages > 0}">
    <a th:if="${assetPage.hasPrevious()}"
       th:href="@{/assets(
           page=${assetPage.number - 1},
           assetCode=${assetCode},
           name=${name},
           categoryId=${categoryId},
           status=${status}
       )}">上一页</a>

    <span>
        第 <span th:text="${assetPage.number + 1}"></span> 页，
        共 <span th:text="${assetPage.totalPages}"></span> 页
    </span>

    <a th:if="${assetPage.hasNext()}"
       th:href="@{/assets(
           page=${assetPage.number + 1},
           assetCode=${assetCode},
           name=${name},
           categoryId=${categoryId},
           status=${status}
       )}">下一页</a>
</nav>
</body>
</html>
