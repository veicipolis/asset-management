<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑资产</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f9fc;
            color: #243047;
        }
        form {
            background: white;
            padding: 24px;
            border-radius: 12px;
        }
        label { display: block; margin-top: 18px; }
        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }
        button {
            margin-top: 24px;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font: inherit;
            cursor: pointer;
        }
        .error { color: #b91c1c; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<a th:href="@{/assets}">返回资产列表</a>
<h1>编辑资产</h1>
<p>资产编号和状态不在此处修改。</p>

<form method="post"
      th:action="@{/assets/{id}/edit(id=${assetId})}"
      th:object="${form}">

    <input type="hidden" th:field="*{version}">

    <div class="error" th:if="${#fields.hasAnyErrors()}">
        <p th:each="error : ${#fields.allErrors()}"
           th:text="${error}"></p>
        <a th:href="@{/assets/{id}/edit(id=${assetId})}">
            重新加载最新数据（将丢弃本次未保存的输入）
        </a>
    </div>

    <label for="name">资产名称</label>
    <input id="name" type="text" th:field="*{name}"
           required maxlength="100">

    <label for="categoryId">分类</label>
    <select id="categoryId" th:field="*{categoryId}" required>
        <option value="">请选择分类</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}"></option>
    </select>

    <label for="purchaseDate">购置日期</label>
    <input id="purchaseDate" type="date"
           th:field="*{purchaseDate}" required>

    <label for="originalValue">资产原值（元）</label>
    <input id="originalValue" type="number"
           th:field="*{originalValue}"
           min="0" max="9999999999999.99" step="0.01" required>

    <label for="location">存放位置</label>
    <input id="location" type="text"
           th:field="*{location}" required maxlength="100">

    <button type="submit">保存修改</button>
</form>
</body>
</html>
