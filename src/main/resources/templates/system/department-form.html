<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>部门维护</title>
</head>
<body>
<h1 th:text="${departmentId == null ? '新增部门' : '编辑部门'}"></h1>

<p><a th:href="@{/system/departments}">返回部门列表</a></p>

<form th:action="${departmentId == null}
        ? @{/system/departments}
        : @{/system/departments/{id}/edit(id=${departmentId})}"
      th:object="${form}"
      method="post">

    <input th:if="${departmentId != null}"
           type="hidden" th:field="*{version}">

    <ul th:if="${#fields.hasAnyErrors()}" style="color: red;">
        <li th:each="message : ${#fields.allErrors()}"
            th:text="${message}"></li>
    </ul>

    <p>
        <label for="name">部门名称</label>
        <input id="name" type="text" th:field="*{name}"
               maxlength="100" required>
    </p>

    <button type="submit">保存</button>
</form>
</body>
</html>
